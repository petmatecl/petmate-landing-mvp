name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        # npm install en vez de npm ci — el lock file tiene el bug conocido
        # de rollup 4.x + optional deps cross-platform: `npm ci` en Linux
        # exige `@rollup/rollup-linux-*` que el lock generado en Windows no
        # tiene, y viceversa. `npm install` resuelve las optional deps en
        # runtime. Fix mientras no regeneremos el lock en Linux.
        # --no-audit --no-fund mantienen el output limpio en CI.
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (tipo-cd handlers fail-close)
        # Sprint c-higiene PR C-2 (2026-09-15) — tests unitarios de handlers
        # corregidos en tipo-cd v2 con Supabase mockeado devolviendo error.
        # Afirma throw/500/flag + cero escritura o email posterior. Ejecuta
        # antes del build para atajar regresión estructural rápido.
        run: npm run test:tipo-cd

      - name: Unit tests (G-1 admin/ wrap+route tag)
        # Sprint bloque-g PR G-1a (2026-09-15) — tests unitarios que
        # verifican que cada endpoint admin/ está envuelto con
        # wrapApiHandlerWithSentry y el tag route se propaga al event
        # capturado en un throw no manejado. Mock del cliente Sentry
        # simula la propagación del routePattern al scope activo.
        run: npm run test:g1-admin

      - name: Unit tests (G-1b agendamientos/ wrap+route tag)
        # Sprint bloque-g PR G-1b (2026-09-15) — tests unitarios que
        # verifican que cada endpoint agendamientos/ está envuelto con
        # wrapApiHandlerWithSentry y el tag route se propaga al event
        # capturado en un throw no manejado.
        run: npm run test:g1-agendamientos

      - name: Unit tests (G-1c cron/+auth/ wrap+route tag)
        # Sprint bloque-g PR G-1c (2026-09-15) — tests unitarios para
        # los 5 crons + 3 endpoints auth, con throw controlado en
        # createClient o en el rate limiter según el path del handler.
        run: npm run test:g1-cron-auth

      - name: Unit tests (G-1d notifs+push+evals wrap+route tag)
        # Sprint bloque-g PR G-1d (2026-09-15) — 2 notifications/ + 2 push/
        # + 2 evaluaciones/. Los 3 endpoints que hacen createClient a nivel
        # módulo (create, push/send, push/subscribe) forzan throw en el
        # limiter en vez del createClient (que rompería el require).
        run: npm run test:g1-notifs-push-evals

      - name: Unit tests (G-1e resto wrap+route tag)
        # Sprint bloque-g PR G-1e (2026-09-15) — 8 endpoints: contactos/,
        # referidos/, servicios/[id]/, waitlist/, root (log-consent, noop,
        # visitor-hash). Los 6 con limiter fuerzan throw ahí; noop y
        # visitor-hash usan test estructural (require + typeof + tracked
        # route pattern) porque no tienen limiter ni supabase.
        run: npm run test:g1-resto

      - name: Build
        run: npm run build
