# .github/workflows/lock-regen.yml
# ---------------------------------------------------------------------------
# Sprint bloque-h H-1 (2026-09-17) — workflow de UN SOLO USO para regenerar
# el package-lock.json en un runner Linux (ubuntu-latest).
#
# MOTIVO:
#   ci.yml + e2e-error-audit.yml usan `npm install` (no `npm ci`) por bug
#   conocido del lock: fue generado en Windows y le faltan las optional deps
#   @rollup/rollup-linux-*, lo cual hace fallar `npm ci` en Linux.
#   Este workflow regenera el lock en Linux (con optional deps completas)
#   para poder restaurar `npm ci` en ambos workflows (más rápido + más
#   determinístico).
#
# ESTRATEGIA (c) del kickoff PO: aceptar el bump con auditoría.
#   1. Borra package-lock.json.
#   2. Corre `npm install` completo → genera un lock nuevo con todas las
#      versiones más recientes que package.json permite (semver ranges).
#   3. Sube el lock como artifact para que el auditor lo descargue y
#      compare vs current.
#   4. NO commitea al branch — el commit + análisis lo hace el auditor.
#
# CONDICIÓN DE PARADA (regla PO): si aparece cualquier major en `next`,
# `react`, `@supabase/*`, `@sentry/*`, `leaflet`, `react-day-picker`, o
# `playwright`, el auditor reporta y no mergea.
#
# ESTE WORKFLOW SE BORRA al cerrar H-1 (workflow de un solo uso).
# ---------------------------------------------------------------------------

name: lock-regen

on:
  workflow_dispatch:

# No concurrency group — este workflow es rarísimo (una vez por sprint).
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Sin cache — queremos un install limpio desde cero.

      - name: Show current lock (SHA + size)
        run: |
          echo "=== Current package-lock.json ==="
          if [ -f package-lock.json ]; then
            wc -l package-lock.json
            sha1sum package-lock.json
          else
            echo "No lock file present."
          fi

      - name: Delete package-lock.json + node_modules
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          echo "Deleted."

      - name: Fresh npm install
        # Sin --no-audit --no-fund para tener output completo si algún
        # paquete falla.
        run: npm install

      - name: Show new lock (SHA + size)
        run: |
          echo "=== New package-lock.json ==="
          wc -l package-lock.json
          sha1sum package-lock.json

      - name: Upload new lock as artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-regenerated
          path: package-lock.json
          retention-days: 7

      - name: Summary of top-level dependencies
        # Volcar lista de deps top-level con versiones resueltas — el
        # auditor las compara vs el lock actual para detectar majors.
        run: |
          echo "=== Top-level installed versions (from new lock) ==="
          node -e "
            const lock = require('./package-lock.json');
            const deps = lock.packages[''].dependencies || {};
            const devDeps = lock.packages[''].devDependencies || {};
            const all = { ...deps, ...devDeps };
            for (const [name, range] of Object.entries(all)) {
              const pkg = lock.packages['node_modules/' + name];
              const resolved = pkg?.version || '?';
              console.log(name.padEnd(50), range.padEnd(15), '→', resolved);
            }
          "
