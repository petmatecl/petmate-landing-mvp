# .github/workflows/visual-update-snapshots.yml
# ---------------------------------------------------------------------------
# Sprint bloque-g G-3 (2026-09-15) — workflow manual para generar o
# actualizar los snapshots baseline de e2e/specs/visual/*.spec.ts en el
# runner Linux de GitHub Actions y committearlos al branch.
#
# POR QUÉ CI Y NO LOCAL:
#   Los snapshots pixel-por-pixel de Playwright difieren entre sistemas
#   operativos (fuentes, sub-pixel rendering, hinting). Si Aldo genera
#   snapshots en Windows local, todos los tests en CI (Linux) van a fallar
#   por diff spurio. La regla: generar snapshots EN el sistema donde
#   corren los tests → CI Ubuntu.
#
# CUÁNDO CORRER ESTE WORKFLOW:
#   1. Primera vez (bloque-g G-3 seed): tras mergear el PR seed, correr
#      este workflow → genera 14 PNGs baseline, los committea al branch
#      main. A partir de acá, cada PR corre el spec sin --update-snapshots
#      y compara contra las baselines.
#   2. Cambio visual intencional aprobado: si BUTTON-CANON incremental
#      efectivamente cambia el look de una página (ej. rediseño de la
#      home), correr este workflow desde el branch del PR — regenera
#      las baselines afectadas. Commit visible en el mismo PR como
#      evidencia del cambio.
#   3. Deploy prod cambió fuentes / assets externos: mismo procedimiento,
#      regenerar baselines desde el branch main.
#
# ENTRADA:
#   Workflow_dispatch con un parámetro opcional `preview_url` para apuntar
#   a un preview específico (default: staging URL del branch staging).
#
# SALIDA:
#   Commit en el branch actual con los PNGs generados/actualizados en
#   e2e/specs/visual/paginas-clave.spec.ts-snapshots/. El commit se
#   pushea directamente al branch — para PRs abiertos, esto trigger una
#   nueva CI run automáticamente.
# ---------------------------------------------------------------------------

name: visual-update-snapshots

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Preview URL de Vercel para correr los tests (default: staging URL)'
        required: false
        default: 'https://pawnecta-landing-mvp-git-staging-petmatecls-projects.vercel.app'
      commit_message:
        description: 'Mensaje de commit para los snapshots actualizados'
        required: false
        default: 'chore(visual): update baseline snapshots from CI runner'
      # Sprint vis-bypass (2026-11-06) — modo artifact-only para que las PNGs
      # nuevas se suban como artifact descargable sin aterrizar automáticamente
      # al branch. Habilita el flow "mándame las imágenes antes de
      # commitearlas". Default false preserva el comportamiento histórico
      # (commit directo al branch desde donde se dispatcheó).
      artifact_only:
        description: 'Si es "true", sube las PNGs como artifact sin commitearlas al branch'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Concurrency compartido con e2e-error-audit para no correr contra staging
# desde 2 lugares en paralelo (los tests visual navegan páginas cacheadas +
# leen data via Supabase staging).
concurrency:
  group: e2e-staging
  cancel-in-progress: false

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # necesario para el commit + push de snapshots.

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + credenciales para push posterior.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        # Sprint bloque-h H-1 (2026-09-17) — restaurado npm ci tras
        # regenerar el lock en Linux (workflow one-shot lock-regen ejecutado
        # 2026-09-17). Lock ahora incluye @rollup/rollup-linux-* correctas.
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        # Necesario para el runner CI — sin esto playwright test falla con
        # "browser executable not found".
        run: npx playwright install chromium --with-deps

      - name: Write e2e/.env.test from secrets
        # El playwright.config.ts requiere e2e/.env.test con credenciales
        # reales. Los secrets ya están cargados para el otro workflow;
        # reusamos el mismo formato.
        env:
          E2E_STAGING_EMAIL: ${{ secrets.E2E_STAGING_EMAIL }}
          E2E_STAGING_PASSWORD: ${{ secrets.E2E_STAGING_PASSWORD }}
          E2E_STAGING_TUTOR_EMAIL: ${{ secrets.E2E_STAGING_TUTOR_EMAIL }}
          E2E_STAGING_TUTOR_PASSWORD: ${{ secrets.E2E_STAGING_TUTOR_PASSWORD }}
          PLAYWRIGHT_BYPASS: ${{ secrets.PLAYWRIGHT_BYPASS }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_STAGING_CRON_SECRET: ${{ secrets.E2E_STAGING_CRON_SECRET }}
        run: |
          mkdir -p e2e
          cat > e2e/.env.test <<EOF
          E2E_STAGING_EMAIL=$E2E_STAGING_EMAIL
          E2E_STAGING_PASSWORD=$E2E_STAGING_PASSWORD
          E2E_STAGING_TUTOR_EMAIL=$E2E_STAGING_TUTOR_EMAIL
          E2E_STAGING_TUTOR_PASSWORD=$E2E_STAGING_TUTOR_PASSWORD
          PLAYWRIGHT_BYPASS=$PLAYWRIGHT_BYPASS
          E2E_SUPABASE_URL=$E2E_SUPABASE_URL
          E2E_SUPABASE_ANON_KEY=$E2E_SUPABASE_ANON_KEY
          E2E_STAGING_CRON_SECRET=$E2E_STAGING_CRON_SECRET
          EOF

      - name: Warmup preview endpoints (cold start amortization pre-setup)
        # Mismo pattern que e2e-error-audit.yml — sin este step, los setups
        # de auth pueden fallar por cold start Vercel + Supabase Auth
        # concurrent bajo mismo request.
        env:
          PREVIEW_URL: ${{ github.event.inputs.preview_url }}
          BYPASS: ${{ secrets.PLAYWRIGHT_BYPASS }}
        run: |
          BYPASS_QP="?x-vercel-protection-bypass=${BYPASS}"
          echo "=== Warmup preview endpoints ==="
          for path in "/" "/login" "/explorar" "/proveedor" "/admin" "/mis-reservas"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "${PREVIEW_URL}${path}${BYPASS_QP}" || echo "000")
            echo "  ${path} → HTTP ${STATUS}"
            sleep 0.5
          done
          echo "=== Warmup done ==="

      - name: Update snapshots
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.preview_url }}
          CI: 'true'
          # Sprint bloque-i I-3 bootstrap (2026-09-17) — bypass del skip
          # gate en `e2e/specs/visual/paginas-clave.spec.ts` cuando el dir
          # de baselines aún no existe. Sin este flag, chicken-and-egg:
          # tests skipean → cero snapshots → dir no se crea → tests siempre
          # skipean. El flag es no-op post-bootstrap (existsSync ya cubre).
          PLAYWRIGHT_VISUAL_BOOTSTRAP: '1'
        run: |
          # --workers=1 evita que los 2 setups (proveedor + tutor) golpeen
          # Supabase Auth staging en paralelo — cuello de infra observado en
          # primer run del workflow (35031817315, 2026-09-15 22:38 UTC).
          # Los 14 snapshots del spec visual son secuenciales igual entre sí.
          #
          # Sprint estab-e2e-tokens (2026-11-10) — capturar salida completa
          # para el guard P8 del step siguiente. `|| true` se mantiene acá
          # porque `--update-snapshots` emite exit 1 cuando escribe snapshots
          # nuevos (comportamiento intencional de Playwright, no fatal). El
          # guard real de "corrió o no" lo hace el step `Verify snapshots
          # regenerated` parseando la salida.
          npx playwright test e2e/specs/visual/ --project=visual --update-snapshots --workers=1 2>&1 | tee /tmp/playwright-out.log || true

      - name: Verify snapshots regenerated (P8 guard - no verde falso)
        # Sprint estab-e2e-tokens (2026-11-10) — guard explícito contra el
        # verde falso del workflow. Incidente origen (run 42870109001,
        # 2026-11-10 17:56 UTC): setup `authenticate as proveedor` falló
        # por timing race del token en localStorage, 14 specs `did not run`,
        # el `|| true` del step anterior capturó el exit 1, y el workflow
        # reportó `conclusion=success`. El upload-artifact subió las PNG
        # viejas del commit base como si fueran nuevas (idénticas byte-a-byte
        # verificadas con `cmp -s`). Falso verde = peor que rojo.
        #
        # Guard: parsear la salida de Playwright para contar specs que
        # corrieron. Si el setup falló (0 passed o muchos did_not_run), este
        # step falla loud → workflow rojo → nadie commitea PNG falsas.
        #
        # Threshold: el spec tiene ~14 tests entre viewports. Pedimos al
        # menos 10 passed y menos de 3 did_not_run (margen para skips
        # legítimos de baselineMissing durante bootstrap).
        run: |
          PASSED=$(grep -oE '^\s+[0-9]+\s+passed' /tmp/playwright-out.log | head -1 | grep -oE '[0-9]+' || echo "0")
          DID_NOT_RUN=$(grep -oE '^\s+[0-9]+\s+did not run' /tmp/playwright-out.log | head -1 | grep -oE '[0-9]+' || echo "0")
          FAILED=$(grep -oE '^\s+[0-9]+\s+failed' /tmp/playwright-out.log | head -1 | grep -oE '[0-9]+' || echo "0")
          echo "=== Resumen: passed=$PASSED failed=$FAILED did_not_run=$DID_NOT_RUN ==="
          if [ "$PASSED" -lt 10 ] || [ "$DID_NOT_RUN" -ge 3 ]; then
            echo "FAIL: setup o specs no corrieron suficientes tests."
            echo "  passed=$PASSED (mín 10), did_not_run=$DID_NOT_RUN (máx 2)"
            echo "=== Últimas 40 líneas del log de Playwright ==="
            tail -40 /tmp/playwright-out.log
            exit 1
          fi
          echo "OK: $PASSED specs pasaron, snapshots regenerados."

      - name: Upload snapshots as artifact (siempre, para audit trail)
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ github.run_id }}
          path: e2e/specs/visual/paginas-clave.spec.ts-snapshots/
          retention-days: 14
          if-no-files-found: warn

      - name: Commit and push snapshots
        if: github.event.inputs.artifact_only != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Sprint bloque-i I-3 fix (2026-09-17) — pattern anterior
          # `e2e/specs/visual/**/*-snapshots/*.png` no matcheaba en bash
          # sin globstar habilitado. Reemplazado por `git add` sobre la
          # carpeta entera del spec — Playwright escribe los .png exactamente
          # ahí (`e2e/specs/visual/paginas-clave.spec.ts-snapshots/`).
          git add "e2e/specs/visual/" || true
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          # Log de lo que se va a commitear (audit trail).
          echo "=== Files staged for commit ==="
          git diff --staged --stat
          echo "==============================="
          git commit -m "${{ github.event.inputs.commit_message }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Skip commit (artifact_only mode)
        if: github.event.inputs.artifact_only == 'true'
        run: |
          echo "=== artifact_only=true → PNGs uploaded as artifact, NOT committed ==="
          echo "Download: gh run download ${{ github.run_id }} --repo ${{ github.repository }}"
          echo "Review manual + commit por separado si corresponde."
