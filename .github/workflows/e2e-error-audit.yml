# .github/workflows/e2e-error-audit.yml
# ---------------------------------------------------------------------------
# Suite Playwright del sprint e2e-error-audit — valida en CI los fixes del
# sprint error-audit (Cases Tipo A) contra preview URL de Vercel.
#
# Sprint estab-e2e (2026-09-11) — split en 2 jobs para acotar F2-3-FLAKINESS:
#   - job `e2e-rapido` corre las suites sin fixture pesado (error-audit,
#     form-post, tipo-b, launch-l1, pan-1) con workers=2. Termina primero.
#   - job `e2e-f2` corre las suites F2 (f2-2b, f2-3, f2-recordatorios-cron)
#     con workers=1 + step de calentamiento previo del preview. Necesita
#     que `e2e-rapido` termine primero (`needs: e2e-rapido`) para no
#     concurrir sobre Supabase staging desde workers paralelos dentro del
#     mismo runner. Ambos comparten concurrency group `e2e-staging` (cross-PR).
#
# Triggers:
#   - pull_request a main → corre contra el preview URL de la PR.
#     (Requiere que la PR tenga un preview URL válido; Vercel lo genera
#     automáticamente para cualquier PR abierta.)
#   - workflow_dispatch → correr manual con URL custom (ej. re-run contra
#     un preview específico para debugging o para los 3 runs del sprint
#     estab-e2e de verificación).
#
# NO se dispara en push a main. Main = prod y los guards de e2e/setup/guard.ts
# rechazan cualquier baseURL de prod (pawnecta.com/pawnecta.cl). Los tests
# solo tienen sentido contra previews.
#
# Secrets requeridos (9, cargados en repo Settings → Secrets and variables →
# Actions):
#   E2E_STAGING_EMAIL         — cuenta admin+proveedor staging (Aldo)
#   E2E_STAGING_PASSWORD      — password de la anterior
#   E2E_STAGING_TUTOR_EMAIL   — cuenta tutora pura staging (Camila)
#   E2E_STAGING_TUTOR_PASSWORD
#   PLAYWRIGHT_BYPASS         — Vercel Deployment Protection token
#   E2E_SUPABASE_URL          — https://<staging-ref>.supabase.co
#   E2E_SUPABASE_ANON_KEY     — anon JWT del proyecto staging (empieza eyJ)
#   E2E_STAGING_CRON_SECRET   — CRON_SECRET Preview scope (para tests API del
#                               cron /api/cron/recordatorio-reserva en la
#                               suite f2-recordatorios-cron/)
#   INTERNAL_API_SECRET       — secreto server-to-server para verifyInternalSecret
#                               (rotado 2026-09-11 durante L1-2 CASE-6). Valor
#                               idéntico al de Vercel Production + Preview.
# ---------------------------------------------------------------------------

name: e2e-error-audit

on:
  # Sprint tipo-b lote 1 (2026-09-09) — path filters removidos por decisión
  # PO. Motivación: la convención "todo fix Tipo A/B con su spec en el
  # mismo PR" hace que la superficie de código relevante crezca — un fix
  # en lib/, components/Shared/ o hooks/* también debe pasar por la suite.
  # 2 minutos por PR es barato vs. riesgo de regression sin CI. El workflow
  # corre en TODO pull_request a main, no en push.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Preview URL de Vercel para correr los tests (default: staging URL del branch staging)'
        required: false
        default: 'https://pawnecta-landing-mvp-git-staging-petmatecls-projects.vercel.app'

concurrency:
  # Sprint L1-1 (2026-09-09) — serialización cross-PR contra staging.
  #
  # Group fijo `e2e-staging` (NO por `github.ref`) → solo 1 run de esta
  # suite toca el proyecto Supabase staging + el bypass de Vercel a la
  # vez, sin importar de qué PR viene. Los demás quedan encolados en
  # `pending` y arrancan al terminar el actual.
  #
  # `cancel-in-progress: false` → cancelar el run activo al llegar uno
  # nuevo destrozaría el cleanup de servicios efímeros a mitad y
  # dejaría huérfanos en staging. Preferimos cola con espera al riesgo
  # de aumentar la contención por half-cleanup.
  #
  # Motivo del cambio: con `${{ github.ref }}` cada PR tenía su cola
  # independiente y múltiples PRs corrían en paralelo sobre la misma
  # base de datos → `beforeAll` timeouts en f2-3 por saturación de
  # Supabase (verificado empíricamente en PR #15 con 4 reruns, subset
  # de tests fallando cambiaba entre reruns).
  #
  # Único workflow del repo que toca staging (verificado 2026-09-09):
  # ci.yml es typecheck+build sin backend, lock-regen es one-shot cero
  # e2e. Si en algún futuro aparece otro workflow que hitea Supabase
  # staging, meterlo en este mismo group `e2e-staging` o justificar
  # por qué no.
  #
  # Trade-off aceptado: en épocas de muchos PRs concurrentes, la suite
  # espera en cola en vez de correr al instante → posible cola de 10-15
  # min si 3-4 PRs están abiertos simultáneamente. Preferible a rojo
  # falso por contención.
  #
  # Typecheck no queda en este grupo — vive en `.github/workflows/ci.yml`
  # con su propio concurrency por-ref, entonces sigue corriendo en
  # paralelo entre PRs sin bloqueo.
  group: e2e-staging
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Job 1 — Suite rápida (sin fixture pesado F2).
  # workers=2, corre primero. Nombre display "Playwright suite error-audit"
  # se mantiene igual que antes del split para preservar la referencia del
  # required check en PRs históricos.
  # ═══════════════════════════════════════════════════════════════════════
  e2e-rapido:
    name: Playwright suite error-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Compose e2e/.env.test from secrets
        run: |
          mkdir -p e2e
          cat > e2e/.env.test <<EOF
          E2E_STAGING_EMAIL=${{ secrets.E2E_STAGING_EMAIL }}
          E2E_STAGING_PASSWORD=${{ secrets.E2E_STAGING_PASSWORD }}
          E2E_STAGING_TUTOR_EMAIL=${{ secrets.E2E_STAGING_TUTOR_EMAIL }}
          E2E_STAGING_TUTOR_PASSWORD=${{ secrets.E2E_STAGING_TUTOR_PASSWORD }}
          PLAYWRIGHT_BYPASS=${{ secrets.PLAYWRIGHT_BYPASS }}
          E2E_SUPABASE_URL=${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY=${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_STAGING_CRON_SECRET=${{ secrets.E2E_STAGING_CRON_SECRET }}
          INTERNAL_API_SECRET=${{ secrets.INTERNAL_API_SECRET }}
          EOF

      - name: Resolve preview URL
        id: preview
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "url=${{ inputs.preview_url }}" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${{ github.head_ref }}"
            echo "url=https://pawnecta-landing-mvp-git-${BRANCH}-petmatecls-projects.vercel.app" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for preview to be Ready (best effort)
        run: |
          URL="${{ steps.preview.outputs.url }}?x-vercel-protection-bypass=${{ secrets.PLAYWRIGHT_BYPASS }}"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "$URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Preview Ready (HTTP $STATUS) after ${i}0s"
              exit 0
            fi
            echo "Preview no Ready aún (HTTP $STATUS), esperando 10s (attempt $i/30)..."
            sleep 10
          done
          echo "Preview NO reached Ready state en 5min — sigo igual, los tests reportarán el fallo con más contexto"

      # Sprint estab-e2e (2026-09-11) — MEDICIÓN Supabase Auth latency.
      # 5 POST staging con anon real + creds dummy (400 esperado tras validar
      # apikey), 5 POST prod con anon dummy (401 rápido). Registra latencia
      # cada request + mediana en log + artifact. Si mediana staging > 3s,
      # cuello de infra → reportar al PO. Correr ANTES de warmup y setup.
      - name: Measure Supabase Auth latency (staging + prod, dummy 401)
        run: |
          STG_URL="https://jmtadvdkicyylcwjcmcl.supabase.co/auth/v1/token?grant_type=password"
          PROD_URL="https://ouezpeeiwjwawauidrqq.supabase.co/auth/v1/token?grant_type=password"
          STG_KEY="${{ secrets.E2E_SUPABASE_ANON_KEY }}"
          PROD_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy.dummy_sig_for_401"
          BODY='{"email":"dummy-latency-probe@example.com","password":"dummy-not-a-real-password"}'
          mkdir -p e2e/.report
          OUT="e2e/.report/supabase-auth-latency.log"
          {
            echo "=== Supabase Auth latency measurement (5 POST c/u, dummy creds → 400/401 esperados) ==="
            echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
          } | tee "$OUT"

          STG_LATS=""
          for i in 1 2 3 4 5; do
            RESP=$(curl -s -o /dev/null -w "%{time_total} %{http_code}" -X POST "$STG_URL" -H "apikey: $STG_KEY" -H "Content-Type: application/json" -d "$BODY" || echo "0 000")
            T=$(echo "$RESP" | awk '{print $1}')
            S=$(echo "$RESP" | awk '{print $2}')
            echo "  staging attempt $i: ${T}s (HTTP $S)" | tee -a "$OUT"
            STG_LATS="$STG_LATS$T\n"
          done
          STG_MED=$(printf "$STG_LATS" | sort -n | awk 'NR==3')
          echo "  staging median: ${STG_MED}s" | tee -a "$OUT"

          echo "" | tee -a "$OUT"
          PROD_LATS=""
          for i in 1 2 3 4 5; do
            RESP=$(curl -s -o /dev/null -w "%{time_total} %{http_code}" -X POST "$PROD_URL" -H "apikey: $PROD_KEY" -H "Content-Type: application/json" -d "$BODY" || echo "0 000")
            T=$(echo "$RESP" | awk '{print $1}')
            S=$(echo "$RESP" | awk '{print $2}')
            echo "  prod    attempt $i: ${T}s (HTTP $S)" | tee -a "$OUT"
            PROD_LATS="$PROD_LATS$T\n"
          done
          PROD_MED=$(printf "$PROD_LATS" | sort -n | awk 'NR==3')
          echo "  prod    median: ${PROD_MED}s" | tee -a "$OUT"

          echo "" | tee -a "$OUT"
          THRESHOLD=3
          CROSSED=$(echo "$STG_MED $THRESHOLD" | awk '{print ($1 > $2) ? "yes" : "no"}')
          if [ "$CROSSED" = "yes" ]; then
            echo "⚠️  ALERTA: staging median ${STG_MED}s > ${THRESHOLD}s (prod median ${PROD_MED}s)" | tee -a "$OUT"
            echo "     Cuello de infraestructura probable → decisión C (plan Supabase Pro para staging)" | tee -a "$OUT"
          else
            echo "OK: staging median ${STG_MED}s ≤ ${THRESHOLD}s (prod median ${PROD_MED}s). Auth latencia estable." | tee -a "$OUT"
          fi

      # Sprint estab-e2e (2026-09-11) — warmup preview endpoints ANTES del
      # auth setup. Amortiza cold start Vercel functions para /login (donde
      # arranca el auth setup) + /proveedor + /admin + /mis-reservas
      # (rutas gated que los tests posteriores navegan). Sin este warmup,
      # el auth setup puede hit el preview cold + Supabase Auth cold en
      # simultáneo → cascada de latencia que causa el timeout de setup
      # visto en run 1 de PR #21 (waitForURL 60s exceeded en ambos setups).
      - name: Warmup preview endpoints (cold start amortization pre-setup)
        run: |
          BASE="${{ steps.preview.outputs.url }}"
          BYPASS="?x-vercel-protection-bypass=${{ secrets.PLAYWRIGHT_BYPASS }}"
          echo "=== Warmup preview endpoints (rapido) ==="
          for path in "/" "/login" "/explorar" "/proveedor" "/admin" "/mis-reservas"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "${BASE}${path}${BYPASS}" || echo "000")
            echo "  ${path} → HTTP ${STATUS}"
            sleep 0.5
          done
          echo "=== Warmup done (rapido) ==="

      - name: Run Playwright suite rápida (error-audit + form-post + tipo-b + launch-l1 + pan-1 + conviene)
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
          CI: 'true'
        # Sprint estab-e2e (2026-09-11) — subset sin fixture F2 pesado.
        # workers=2 (default de Playwright en CI) — cargas ligeras.
        run: npx playwright test e2e/specs/error-audit/ e2e/specs/form-post/ e2e/specs/tipo-b/ e2e/specs/launch-l1/ e2e/specs/pan-1/ e2e/specs/conviene/ --reporter=list 2>&1 | tee /tmp/rapido-stdout.log

      - name: Extract AUTH-RETRY marks to artifact
        # Sprint estab-e2e (2026-09-11) — el `authenticate.ts` helper hace
        # retry ≤3× del submit + waitForURL 30s cada uno. Cada intento loguea
        # `[AUTH-RETRY] role attempt N/3 ...`. Extraer al artifact para saber
        # si los runs verdes vienen tras 1 intento (infra OK) o tras 2-3
        # intentos (infra flake — señal de que la mediana del step Measure
        # miente en promedio pero hay percentiles altos).
        if: always()
        run: |
          mkdir -p e2e/.report
          grep -E "^\[AUTH-RETRY\]|\[AUTH-RETRY\]" /tmp/rapido-stdout.log > e2e/.report/auth-retry.log || echo "(no auth-retry marks found)" > e2e/.report/auth-retry.log
          echo "=== Sample de auth-retry marks ==="
          cat e2e/.report/auth-retry.log || true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-rapido-${{ github.run_id }}
          path: e2e/.report
          retention-days: 7

      - name: Upload test-results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-rapido-${{ github.run_id }}
          path: test-results
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════
  # Job 2 — Suite F2 (con fixture pesado).
  # workers=1 + step de calentamiento del preview + needs=[e2e-rapido]
  # para que corra DESPUÉS del rápido. Instrumentación timing via console.log
  # de los helpers en `e2e/fixtures/timing.ts` (llamados desde los helpers
  # `crearServicioCuidadoConF2`, `preInsertarReservaConfirmada`,
  # `cleanupHuerfanosF23`, `borrarServicioResiliente`, `irAMisSolicitudes`).
  # El stdout del test capturado por list reporter llega al log del step;
  # extraído post-run al artifact `timing-f2-<run_id>` para análisis.
  # ═══════════════════════════════════════════════════════════════════════
  e2e-f2:
    name: Playwright suite F2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: e2e-rapido
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Compose e2e/.env.test from secrets
        run: |
          mkdir -p e2e
          cat > e2e/.env.test <<EOF
          E2E_STAGING_EMAIL=${{ secrets.E2E_STAGING_EMAIL }}
          E2E_STAGING_PASSWORD=${{ secrets.E2E_STAGING_PASSWORD }}
          E2E_STAGING_TUTOR_EMAIL=${{ secrets.E2E_STAGING_TUTOR_EMAIL }}
          E2E_STAGING_TUTOR_PASSWORD=${{ secrets.E2E_STAGING_TUTOR_PASSWORD }}
          PLAYWRIGHT_BYPASS=${{ secrets.PLAYWRIGHT_BYPASS }}
          E2E_SUPABASE_URL=${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY=${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_STAGING_CRON_SECRET=${{ secrets.E2E_STAGING_CRON_SECRET }}
          INTERNAL_API_SECRET=${{ secrets.INTERNAL_API_SECRET }}
          EOF

      - name: Resolve preview URL
        id: preview
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "url=${{ inputs.preview_url }}" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${{ github.head_ref }}"
            echo "url=https://pawnecta-landing-mvp-git-${BRANCH}-petmatecls-projects.vercel.app" >> "$GITHUB_OUTPUT"
          fi

      # Sprint estab-e2e (2026-09-11) — calentamiento del preview antes de
      # correr F2. La suite F2 abre el picker /servicio/[id] (Vercel lambda
      # cold start ~1-2s la primera vez) + hitea /api/agendamientos/cancelar
      # + /api/servicios/[id]/disponibilidad-noches. Un warmup pega esos
      # endpoints una vez ANTES del primer test para amortizar el cold start.
      # Sin id concreto de servicio en staging, calentamos rutas genéricas
      # que atraviesan los mismos Vercel functions:
      #   - / (renderiza SSG home + hidrata)
      #   - /explorar (hidrata explorer + RPC buscar_servicios)
      #   - /proveedor (auth check + panel bell)
      #   - /mis-reservas (query agendamientos, ruta que causó el s3/s7 stall)
      # 3 hits cada uno con 500ms de gap para no saturar cold pool.
      - name: Warmup preview endpoints (cold start amortization)
        run: |
          URL="${{ steps.preview.outputs.url }}?x-vercel-protection-bypass=${{ secrets.PLAYWRIGHT_BYPASS }}"
          BASE="${{ steps.preview.outputs.url }}"
          BYPASS="?x-vercel-protection-bypass=${{ secrets.PLAYWRIGHT_BYPASS }}"
          echo "=== Warmup preview endpoints ==="
          for path in "/" "/explorar" "/proveedor" "/mis-reservas"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "${BASE}${path}${BYPASS}" || echo "000")
            echo "  ${path} → HTTP ${STATUS}"
            sleep 0.5
          done
          # Segundo pass para asegurar que el pool warm queda estable.
          for path in "/" "/explorar" "/proveedor" "/mis-reservas"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "${BASE}${path}${BYPASS}" || echo "000")
            echo "  ${path} (2nd) → HTTP ${STATUS}"
            sleep 0.5
          done
          echo "=== Warmup done ==="

      - name: Run Playwright suite F2 (f2-2b + f2-3 + f2-recordatorios-cron) --workers=1
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
          CI: 'true'
        # Sprint estab-e2e (2026-09-11) — workers=1 forzado. Los tests f2
        # dependen fuertemente de Supabase staging (INSERT servicios,
        # agendamientos, blackouts) y con workers=2 competían por el pool
        # de conexiones + causaban stalls en fetches cliente de
        # /mis-reservas (F2-3-FLAKINESS observada en PR #20).
        # Instrumentación timing por hook (via console.log de fixtures)
        # queda capturada en el log del step + el HTML report.
        run: npx playwright test e2e/specs/f2-2b/ e2e/specs/f2-3/ e2e/specs/f2-recordatorios-cron/ --workers=1 --reporter=list 2>&1 | tee /tmp/f2-stdout.log

      - name: Extract timing marks to artifact
        # Sprint estab-e2e (2026-09-11) — el reporter list captura stdout
        # de los tests (incluyendo los console.log de `[TIMING] ...` de los
        # helpers de fixtures). Aquí extraemos solo esas líneas al artifact
        # para análisis post-run sin ruido.
        if: always()
        run: |
          mkdir -p e2e/.report
          grep -E "^\[TIMING\]|\[TIMING\]" /tmp/f2-stdout.log > e2e/.report/timing-f2.log || echo "(no timing marks found)" > e2e/.report/timing-f2.log
          echo "=== Sample de timing marks (primeras 30 líneas) ==="
          head -30 e2e/.report/timing-f2.log || true

      - name: Upload Playwright HTML report + timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-f2-${{ github.run_id }}
          path: |
            e2e/.report
            /tmp/f2-stdout.log
          retention-days: 7

      - name: Upload test-results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-f2-${{ github.run_id }}
          path: test-results
          retention-days: 7
